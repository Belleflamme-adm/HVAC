<title>HVAC Belleflamme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Coquille du HTML de test : barre de test en haut, l'app réelle dans le cadre en dessous. */
:root { --bg: #f3f5f4; --surface: #ffffff; --ink: #14201a; --muted: #56635b; --line: #e1e6e3; --vert: #1fa64a; --jaune: #fff5d6; --jaune-ink: #6b4e00; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0c1410; --surface: #141f19; --ink: #e6efe9; --muted: #9fb0a5; --line: #24332b; --vert: #22b452; --jaune: #3a2f08; --jaune-ink: #f3d77a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0c1410; --surface: #141f19; --ink: #e6efe9; --muted: #9fb0a5; --line: #24332b; --vert: #22b452; --jaune: #3a2f08; --jaune-ink: #f3d77a; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 "Segoe UI", Roboto, system-ui, sans-serif; display: flex; flex-direction: column; }
.test { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--jaune); color: var(--jaune-ink); border-bottom: 1px solid var(--line); }
.test strong { font-weight: 700; }
.test label { display: inline-flex; gap: 6px; align-items: center; }
.test select, .test button { font: inherit; padding: 5px 10px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
.test button.vert { background: var(--vert); border-color: var(--vert); color: #ffffff; font-weight: 700; }
.test button:focus-visible, .test select:focus-visible { outline: 2px solid var(--vert); outline-offset: 2px; }
.test .heure { font-variant-numeric: tabular-nums; font-weight: 700; }
.test .version { margin-left: auto; font-size: 12px; opacity: .8; }
#adresse { font-size: 12px; opacity: .8; }
/* Barre réduite quand on défile dans l'app : une seule ligne (titre, utilisateur, bouton pour déplier) */
.test { transition: padding .15s; }
.test .deplier { display: none; }
.test.reduite { padding-block: 4px; gap: 6px 10px; flex-wrap: nowrap; }
.test.reduite > :not(.toujours) { display: none; }
.test.reduite .deplier { display: inline-block; white-space: nowrap; flex: none; padding: 2px 10px; }
.test.reduite .qui-texte { display: none; }
.test.reduite select { padding: 2px 8px; max-width: 58vw; text-overflow: ellipsis; }
.test.reduite strong { font-size: 12px; white-space: nowrap; }
iframe { flex: 1; width: 100%; border: 0; background: var(--bg); min-height: 0; }
#pointage-sim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
#pointage-sim .ps-fen { background: #fff; color: #14201a; border-radius: 14px; width: min(420px, 100%); overflow: hidden; font-family: system-ui, sans-serif; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
#pointage-sim .ps-barre { background: #1d47c2; color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
#pointage-sim .ps-barre span { font-size: 12px; opacity: .85; text-transform: uppercase; letter-spacing: .05em; }
#pointage-sim .ps-corps { padding: 14px; display: grid; gap: 10px; }
#pointage-sim .ps-titre { font-weight: 700; margin: 0; }
#pointage-sim label { display: grid; gap: 4px; font-weight: 600; }
#pointage-sim input { font: inherit; padding: 8px; border: 1px solid #c9d2cc; border-radius: 8px; }
#pointage-sim .ps-actions { display: flex; flex-wrap: wrap; gap: 8px; }
#pointage-sim button { font: inherit; font-weight: 700; padding: 8px 14px; border-radius: 999px; border: 1px solid #1d47c2; background: #fff; color: #1d47c2; cursor: pointer; }
#pointage-sim .ps-ok { background: #1d47c2; color: #fff; }
#pointage-sim .ps-annuler-visite { border-color: #b4232c; color: #b4232c; }
#pointage-sim .ps-note { font-size: 13px; color: #56635b; margin: 0; }
.courriel-simule { position: fixed; right: 12px; bottom: 76px; z-index: 50; max-width: 300px; background: #fff8e1; border: 1px solid #c9a227;
  border-radius: 10px; padding: 10px 34px 10px 12px; font: 14px/1.4 system-ui, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.18); color: #222; }
.courriel-simule .code { font-size: 22px; letter-spacing: 3px; }
.courriel-simule button { position: absolute; top: 4px; right: 6px; border: 0; background: none; font-size: 20px; cursor: pointer; color: #555; }
</style>

<div class="test" role="region" aria-label="Contrôles de test">
  <strong class="toujours">HTML DE TEST</strong>
  <label for="qui" class="toujours"><span class="qui-texte">Connecté comme</span>
    <select id="qui">
      <option value="simon">Simon Cardinal | Admin tout (board principal)</option>
      <option value="marc">Marc | Vendeur (murale simple et multi)</option>
      <option value="sophie">Sophie | Vendeuse (tous les types)</option>
      <option value="karim">Karim | Vendeur (inactif au board)</option>
      <option value="clim">Clim Laurentides | Sous-traitant</option>
      <option value="rive">Climatisation Rive-Nord | Sous-traitant</option>
      <option value="mauri">Froid Centre-du-Québec | Sous-traitant</option>
      <option value="outa">Thermo Outaouais | Sous-traitant</option>
    </select>
  </label>
  <span>Heure simulée <span class="heure" id="heure"></span></span>
  <button type="button" id="plus5">+5 min</button>
  <button type="button" id="plus30">+30 min</button>
  <button type="button" id="plus1j">+1 jour</button>
  <button type="button" class="vert" id="arrive">Un lead arrive de Monday</button>
  <button type="button" class="vert" id="depot">Un dépôt arrive de l'app de Mike</button>
  <button type="button" class="vert" id="manque">Un appel manqué arrive</button>
  <button type="button" id="repond" hidden>Le client répond par texto</button>
  <button type="button" id="lien-st" hidden>Ouvrir le lien comme le sous-traitant</button>
  <span id="adresse"></span>
  <span class="version">Version __VERSION__ | données fictives, rien n'est enregistré</span>
  <button type="button" class="deplier toujours" id="deplier" aria-expanded="false" title="Afficher les contrôles de test">▾ Test</button>
</div>
<iframe id="app" title="Application HVAC"></iframe>

<script>

</script>
<script>
/*__PAGES__*/
/*__DONNEES__*/
(() => {
  const S = window.__demoServeur;
  // Municipalités pour la recherche (faux serveur), tirées des vraies limites
  try {
    for (const f of ['/data/municipalites.geojson', '/data/municipalites-on.geojson']) {
      const g = window.__demoDonnees[f] && JSON.parse(window.__demoDonnees[f]);
      if (g) S.etat.municipalites.push(...g.features.map((x) => x.properties));
    }
  } catch (e) { /* sans carte */ }
  window.__demoCourant = { path: '/', search: '', hash: '' };
  let dernierY = 0;   // dernière position de défilement de la page (barre de test réduite)
  // Historique (flèche Retour d'Android, bouton Précédent) : chaque changement de page s'inscrit dans l'historique
  // du navigateur, sans changer l'adresse ; Retour réaffiche la page d'avant, un pas à la fois.
  // mode : 'ajouter' | 'remplacer' | 'aucun'. Chaque étape garde sa page ET l'utilisateur simulé : si l'afficheur
  // (app Claude, WebView) recharge le test sur un Retour, on réaffiche la page de cette étape, pas l'accueil.
  const qui = document.getElementById('qui');
  const inscrire = (url, mode) => {
    const etat = { demoUrl: url, demoQui: qui.value };
    try {
      if (mode === 'ajouter') history.pushState(etat, '');
      else if (mode === 'remplacer') history.replaceState(etat, '');
    } catch (e) { /* cadre qui refuse l'historique : navigation sans Retour */ }
  };
  const prendreQui = (q) => { if (q && S.UTILISATEURS[q] && qui.value !== q) { qui.value = q; S.changerUtilisateur(q); } };
  window.addEventListener('popstate', (e) => {
    if (e.state && e.state.demoUrl) { prendreQui(e.state.demoQui); window.__naviguer(e.state.demoUrl, 'aucun'); }
  });
  // Un NOUVEAU cadre à chaque page : changer le contenu d'un cadre existant ajoute, sur certains Android, des entrées
  // d'historique au cadre lui-même, qui se mêlent aux nôtres. Un cadre neuf n'en ajoute aucune.
  const afficher = (html) => {
    const ancien = document.getElementById('app');
    const neuf = document.createElement('iframe');
    neuf.id = 'app'; neuf.title = ancien.title; neuf.srcdoc = html;
    ancien.replaceWith(neuf);
  };
  window.__naviguer = (url, mode = 'ajouter') => {
    const u = new URL(url, 'https://demo.local' + window.__demoCourant.path);
    const courant = window.__demoCourant.path + window.__demoCourant.search;
    if (mode === 'ajouter' && `${u.pathname}${u.search}` === courant) mode = 'remplacer';   // même page : pas de doublon
    let page = u.pathname.replace(/^\/|\.html$/g, '') || 'index';
    // Page de connexion : seulement après « Déconnexion » (ADR-095) ; sinon on est déjà connecté
    if (page === 'login' && !S.deconnecte()) page = 'index';
    if (qui.value !== S.qui()) qui.value = S.qui();
    window.__demoCourant = { path: page === 'index' && u.pathname === '/login' ? '/' : u.pathname, search: u.search, hash: u.hash };
    document.getElementById('adresse').textContent = `Page : ${u.pathname}${u.search}${u.hash ? '#…' : ''}`;
    const html = window.__demoPages[page] || `<!doctype html><meta charset="utf-8"><body style="font-family:system-ui;padding:24px">
      <h1>Page en veille</h1><p>« ${u.pathname.replace(/[<>&]/g, '')} » n'est pas dans le HTML de test (module de l'app de Mike).</p>
      <p><a href="#" onclick="parent.__naviguer('/');return false">Retour à l'accueil</a></p></body>`;
    inscrire(`${u.pathname}${u.search}${u.hash}`, mode);
    dernierY = 0;
    afficher(html);
  };
  // Courriel simulé (ADR-095) : le code de connexion s'affiche ici au lieu de partir par courriel
  window.__demoCourriel = (email, code) => {
    document.querySelector('.courriel-simule')?.remove();
    const b = document.createElement('div');
    b.className = 'courriel-simule'; b.setAttribute('role', 'status');
    b.innerHTML = `<strong>Courriel simulé</strong> à ${email.replace(/[<>&]/g, '')}<br>Votre code Belleflamme : <b class="code">${code}</b><button type="button" aria-label="Fermer">×</button>`;
    b.querySelector('button').onclick = () => b.remove();
    document.body.append(b);
  };
  const recharger = () => window.__naviguer(window.__demoCourant.path + window.__demoCourant.search + (window.__demoCourant.hash || ''), 'remplacer');
  // Dernier lien de demande de prix créé : l'ouvrir comme le sous-traitant (sans compte)
  const boutonLien = document.getElementById('lien-st');
  setInterval(() => { boutonLien.hidden = !S.dernierLien(); }, 700);
  boutonLien.addEventListener('click', () => window.__naviguer(S.dernierLien()));
  const heure = () => { const d = S.heure(); document.getElementById('heure').textContent = `${d.toLocaleDateString('fr-CA', { weekday: 'short', day: 'numeric', month: 'short' })}, ${d.toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' })}`; };
  qui.addEventListener('change', (e) => { S.changerUtilisateur(e.target.value); window.__naviguer('/'); });
  document.getElementById('plus5').addEventListener('click', () => { S.avancer(5); heure(); recharger(); });
  document.getElementById('plus30').addEventListener('click', () => { S.avancer(30); heure(); recharger(); });
  document.getElementById('plus1j').addEventListener('click', () => { S.avancer(24 * 60); heure(); recharger(); });
  // Moteur de règles (ADR-090) : appel manqué, réponse du client (sur la fiche d'un lead)
  document.getElementById('manque').addEventListener('click', () => { const l = S.appelManque(); heure(); window.__naviguer(`/lead?id=${l.id}`); });
  const repond = document.getElementById('repond');
  setInterval(() => { repond.hidden = !(window.__demoCourant.path === '/lead' && /[?&]id=/.test(window.__demoCourant.search)); }, 500);
  repond.addEventListener('click', () => { const id = new URLSearchParams(window.__demoCourant.search).get('id'); if (S.clientRepond(id)) recharger(); });
  document.getElementById('arrive').addEventListener('click', () => { const l = S.leadArrive(); heure(); window.__naviguer(`/lead?id=${l.id}`); });
  // Barre de test réduite pendant qu'on défile dans l'app ; dépliée en revenant en haut ou avec « ▾ Test »
  const barre = document.querySelector('.test');
  const deplier = document.getElementById('deplier');
  const reduire = (oui) => { barre.classList.toggle('reduite', oui); deplier.setAttribute('aria-expanded', String(!oui)); };
  // On réduit seulement quand on DESCEND (le cadre qui change de taille en dépliant ne compte pas comme un défilement)
  let ignorerJusqua = 0;   // après « ▾ Test », le navigateur réajuste la page : ce n'est pas l'utilisateur qui défile
  window.__defilement = (y) => {
    if (Date.now() < ignorerJusqua) { dernierY = y; return; }
    if (y < 5) reduire(false);
    else if (y > 40 && y - dernierY > 8) reduire(true);
    dernierY = y;
  };
  deplier.addEventListener('click', () => { ignorerJusqua = Date.now() + 900; reduire(false); });
  // Dépôt simulé (ADR-087) : le plus ancien projet en attente du dépôt passe seul à « À céduler »
  document.getElementById('depot').addEventListener('click', () => {
    const r = S.depotRecu();
    if (!r) { alert('Aucun projet en attente du dépôt dans le Macro.'); return; }
    window.__naviguer('/macro');
  });
  // Pointage simulé (ADR-086) : le vrai Pointage est dans l'app de Mike. Ici, une fenêtre imite le formulaire de
  // pré-installation Ventilation ; à l'enregistrement, la visite part comme le ferait le webhook, et le lead se met à jour seul.
  window.__pointageSimule = (url) => {
    const ref = new URL(url).searchParams.get('hvac_lead');
    const l = S.leadPointage(ref);
    if (!l) return;
    document.getElementById('pointage-sim')?.remove();
    const fond = document.createElement('div');
    fond.id = 'pointage-sim';
    fond.innerHTML = `<div class="ps-fen" role="dialog" aria-modal="true" aria-label="Pointage (simulation)">
      <div class="ps-barre"><strong>Pointage | app de Mike</strong><span>simulation</span></div>
      <div class="ps-corps">
        <p class="ps-titre">Formulaire de pré-installation | Ventilation</p>
        <p>Client : <strong></strong><br><span class="ps-tel"></span></p>
        <label>Date et heure de la visite<input type="datetime-local" required></label>
        <div class="ps-actions"><button type="button" class="ps-ok">Enregistrer dans Pointage</button>
          ${l.ref ? '<button type="button" class="ps-annuler-visite">Annuler la visite</button>' : ''}
          <button type="button" class="ps-fermer">Fermer</button></div>
        <p class="ps-note">Dans la vraie app, ceci se fait dans Pointage. La date arrive ensuite toute seule dans le lead.</p>
      </div></div>`;
    fond.querySelector('.ps-corps strong').textContent = l.nom || 'Client';
    fond.querySelector('.ps-tel').textContent = [l.tel, l.ville].filter(Boolean).join(' | ');
    const champ = fond.querySelector('input');
    const pad = (n) => String(n).padStart(2, '0');
    const d = l.visite_le ? new Date(l.visite_le) : new Date(S.heure().getTime() + 2 * 864e5);
    if (!l.visite_le) d.setHours(10, 0, 0, 0);
    champ.value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const fermer = () => fond.remove();
    const envoyer = (p) => { try { S.visitePointage(p); } catch (e) { alert(e.message); return; } fermer(); recharger(); };
    fond.querySelector('.ps-fermer').onclick = fermer;
    fond.querySelector('.ps-ok').onclick = () => { if (!champ.value) return; envoyer({ lead_ref: l.id, pointage_ref: l.ref || `PI-${Date.now().toString(36)}`, visite_le: new Date(champ.value).toISOString() }); };
    const ann = fond.querySelector('.ps-annuler-visite');
    if (ann) ann.onclick = () => envoyer({ pointage_ref: l.ref, annulee: true });
    document.body.append(fond);
    champ.focus();
  };
  // Lien direct par utilisateur : …#simon, #marc, #sophie, #karim, #clim, #rive, #mauri, #outa
  const depart = (location.hash || '').slice(1);
  if (S.UTILISATEURS[depart]) { S.changerUtilisateur(depart); qui.value = depart; }
  heure();
  // Rechargé au milieu de l'historique (Retour qui recharge, rotation de l'écran) : on reprend la page de cette étape
  const repris = history.state && history.state.demoUrl ? history.state : null;
  if (repris) prendreQui(repris.demoQui);
  window.__naviguer(repris ? repris.demoUrl : '/', 'remplacer');
})();
</script>
