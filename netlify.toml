# Site statique + Netlify Functions, comme l'app de Mike.
# Netlify sert /login à partir de public/login.html : les liens n'ont jamais de « .html ».

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  publish = "public"
  functions = "netlify/functions"
  port = 8888

# Le service worker ne doit jamais être mis en cache par le CDN.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
